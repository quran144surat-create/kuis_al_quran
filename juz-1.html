/*
  =====================================================================
  TEMPLAT HALAMAN MUSHAF PER JUZ — CATATAN UNTUK SIAPA PUN YANG LANJUT
  =====================================================================
  Tujuan: menampilkan gambar/scan halaman mushaf 1 juz, dan bisa dituju
  langsung dari aplikasi "Kuis Muraja'ah" (index.html) via deep-link.

  CARA PAKAI UNTUK JUZ LAIN:
  1. Duplikat file ini jadi juz-2.html, juz-3.html, dst.
  2. Ubah konstanta JUZ_NUMBER di <script> paling bawah.
  3. Isi IMG_BASE_URL dengan base URL folder gambar (mis. GitHub raw URL).
     Contoh: 'https://raw.githubusercontent.com/USER/REPO/main/juz1/'
  4. Sesuaikan fungsi pageFileName(pageNumber) kalau pola nama filenya
     bukan angka 3-digit + .jpg (mis. 001.jpg, 002.jpg, ...).
  5. Kalau belum ada URL gambar, IMG_BASE_URL boleh dikosongkan dulu —
     halaman akan menampilkan kotak placeholder bernomor.

  DEEP-LINK DARI KUIS (index.html):
  Buka file ini dengan salah satu parameter URL:
    ?s=2&a=255      -> surah 2 (Al-Baqarah), ayat 255 -> auto ke halamannya
    ?p=42           -> langsung ke halaman mushaf nomor 42
  Kalau ayat yang diminta ternyata ada di juz lain, halaman ini akan
  otomatis redirect ke file juz yang benar (pola nama: juz-N.html),
  ganti fungsi otherJuzFileName(n) kalau pola nama filenya beda.

  Data batas halaman (PS) & jumlah ayat per surah (AY) disalin dari
  index.html supaya perhitungan surah:ayat -> halaman selalu konsisten
  antara kuis dan mushaf.
  =====================================================================
*/

  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column;min-height:100%}

.wrap{flex:1 1 auto;min-height:0;display:flex;direction:rtl;overflow-x:auto;overflow-y:hidden;

.page{flex:0 0 100%;max-width:640px;margin:0 auto;scroll-snap-align:center;scroll-snap-stop:always;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;

  display:flex;flex-direction:column;direction:ltr}
.page.highlight{border-color:var(--em);box-shadow:0 0 0 3px color-mix(in srgb,var(--em) 30%,transparent)}
.page img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;border-radius:8px;margin:auto 0}
.page .label{display:flex;justify-content:space-between;color:var(--muted);
  font-size:12px;margin-top:8px;padding:0 2px;flex:0 0 auto}
.placeholder{aspect-ratio:210/297;background:var(--surface2);border-radius:8px;

    targetPage=parseInt(qs.get('p'),10);
  }else if(qs.has('s')&&qs.has('a')){
    const s=parseInt(qs.get('s'),10), a=parseInt(qs.get('a'),10);
    const g=GSTART[s-1]+a;
    targetPage=pageOfGlobalAyah(g);
  }
  if(!targetPage) return;
  const targetJuz=juzOfPage(targetPage);
  if(targetJuz!==JUZ_NUMBER){
    location.href=otherJuzFileName(targetJuz)+location.search;
    return;
  }
  const el=document.getElementById('page-'+targetPage);
  if(el){
    setTimeout(()=>{
      el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      el.classList.add('highlight');
      setTimeout(()=>el.classList.remove('highlight'),2500);
    },80);
  }
})();

document.getElementById('btnBack').onclick=()=>{
  if(QUIZ_URL) location.href=QUIZ_URL; else history.back();
};
</script>
</body>
</html>
